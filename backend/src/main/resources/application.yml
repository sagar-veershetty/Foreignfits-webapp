server:
  port: ${PORT:5000}
  servlet:
    context-path: /api

spring:
  application:
    name: foreign-fits-inventory
  
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:foreignfits;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: ${DB_CONN_TIMEOUT:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT:600000}
      max-lifetime: ${DB_MAX_LIFETIME:1800000}
    
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:create}
    show-sql: ${SHOW_SQL:true}
    database-platform: ${DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    
  sql:
    init:
      mode: ${SQL_INIT_MODE:always}
      data-locations: classpath:data.sql
      continue-on-error: false
      
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

# JWT Configuration
jwt:
  secret: foreignFitsSecretKeyForJWTTokenGeneration2024
  expiration: 86400000

# Logging
logging:
  level:
    com.foreignfits: DEBUG
    org.springframework.security: DEBUG
    org.hibernate: INFO
    org.springframework.jdbc: DEBUG
    org.springframework.boot.autoconfigure: DEBUG

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info
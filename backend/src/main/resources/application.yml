server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: foreign-fits-inventory
  
  datasource:
    url: jdbc:h2:file:./data/foreignfits;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
    
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true
    
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql
      continue-on-error: false
      
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

# JWT Configuration
jwt:
  secret: foreignFitsSecretKeyForJWTTokenGeneration2024
  expiration: 86400000

# Logging
logging:
  level:
    com.foreignfits: DEBUG
    org.springframework.security: DEBUG
    org.hibernate: INFO

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info
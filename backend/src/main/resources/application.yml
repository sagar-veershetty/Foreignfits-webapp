server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: foreign-fits-inventory
  
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/foreignfits}
    username: ${DATABASE_USERNAME:foreignfits_admin}
    password: ${DATABASE_PASSWORD:foreignfits123}
    driver-class-name: ${DATABASE_DRIVER:org.postgresql.Driver}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: ${DB_CONN_TIMEOUT:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT:600000}
      max-lifetime: ${DB_MAX_LIFETIME:1800000}
    
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:true}
    database-platform: ${DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  
  # Flyway Configuration  
  flyway:
    enabled: false
    
  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
      data-locations: classpath:data.sql
      continue-on-error: false
      
  h2:
    console:
      enabled: false

# JWT Configuration
jwt:
  secret: foreignFitsSecretKeyForJWTTokenGeneration2024
  expiration: 86400000

# Logging
logging:
  level:
    com.foreignfits: DEBUG
    org.springframework.security: DEBUG
    org.hibernate: INFO
    org.springframework.jdbc: DEBUG
    org.springframework.boot.autoconfigure: DEBUG

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info
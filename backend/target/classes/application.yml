server:
  port: 8080

spring:
  application:
    name: foreign-fits-inventory
  
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password: 
    driver-class-name: org.h2.Driver
    
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true
    
  sql:
    init:
      mode: always
      
  h2:
    console:
      enabled: true
      path: /h2-console

# JWT Configuration
jwt:
  secret: foreignFitsSecretKeyForJWTTokenGeneration2024
  expiration: 86400000

# Logging
logging:
  level:
    com.foreignfits: DEBUG
    org.springframework.security: DEBUG
    org.hibernate: INFO

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info
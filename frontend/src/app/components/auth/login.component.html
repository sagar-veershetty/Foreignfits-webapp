<div class="login-container"> <div class="login-card"> <!-- Header --> <div class="login-header"> <div class="logo-container"> <div class="logo-icon"> <svg class="logo-svg" fill="none" stroke="currentColor" viewBox="0 0 24 24"> <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path> </svg> </div> </div> <h1 class="brand-title">Foreign Fits</h1> <p class="brand-subtitle">Global Fashion Inventory Management</p> </div> <!-- Login Form --> <div class="login-form-container"> <div class="form-header"> <h2 class="form-title">Welcome Back</h2> <p class="form-subtitle">Sign in to your account</p> </div> <div *ngIf="(authState$ | async)?.error" class="error-container"> <div class="error-content"> <svg class="error-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"> <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path> </svg> <span class="error-title">Login Failed</span> </div> <p class="error-message">{{ (authState$ | async)?.error }}</p> </div> <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="login-form"> <div class="form-group"> <label class="form-label">Email Address</label> <input type="email" required [(ngModel)]="credentials.email" name="email" (input)="clearError()" class="form-input" placeholder="Enter your email" /> </div> <div class="form-group"> <label class="form-label">Password</label> <div class="password-container"> <input [type]="showPassword ? 'text' : 'password'" required [(ngModel)]="credentials.password" name="password" (input)="clearError()" class="form-input password-input" placeholder="Enter your password" /> <button type="button" (click)="showPassword = !showPassword" class="password-toggle" > <svg *ngIf="!showPassword" class="toggle-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"> <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path> <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path> </svg> <svg *ngIf="showPassword" class="toggle-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"> <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"></path> </svg> </button> </div> </div> <button type="submit" [disabled]="(authState$ | async)?.isLoading || !loginForm.valid" class="submit-button" > <svg *ngIf="(authState$ | async)?.isLoading" class="submit-spinner" fill="none" viewBox="0 0 24 24"> <circle class="spinner-circle" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle> <path class="spinner-path" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path> </svg> <span>{{ (authState$ | async)?.isLoading ? 'Signing In...' : 'Sign In' }}</span> </button> </form> <!-- Demo Accounts --> <div class="demo-section"> <p class="demo-title">Demo Accounts (Password: admin123):</p> <div class="demo-grid"> <button (click)="handleDemoLogin('admin')" type="button" class="demo-card demo-admin"> <div class="demo-icon">👤</div> <div class="demo-info"> <div class="demo-role">Admin</div> <div class="demo-email">admin&#64;foreignfits.com</div> </div> </button> <button (click)="handleDemoLogin('warehouse1')" type="button" class="demo-card demo-warehouse"> <div class="demo-icon">📦</div> <div class="demo-info"> <div class="demo-role">Warehouse 1</div> <div class="demo-email">warehouse1&#64;foreignfits.com</div> </div> </button> <button (click)="handleDemoLogin('warehouse2')" type="button" class="demo-card demo-warehouse"> <div class="demo-icon">📦</div> <div class="demo-info"> <div class="demo-role">Warehouse 2</div> <div class="demo-email">warehouse2&#64;foreignfits.com</div> </div> </button> <button (click)="handleDemoLogin('sales-wholesale')" type="button" class="demo-card demo-sales"> <div class="demo-icon">🛒</div> <div class="demo-info"> <div class="demo-role">Sales (Wholesale)</div> <div class="demo-email">sales.wholesale&#64;foreignfits.com</div> </div> </button> <button (click)="handleDemoLogin('sales-retail')" type="button" class="demo-card demo-sales"> <div class="demo-icon">🛍️</div> <div class="demo-info"> <div class="demo-role">Sales (Retail)</div> <div class="demo-email">sales.retail&#64;foreignfits.com</div> </div> </button> </div> </div> <!-- Customer Shopping Link --> <div class="customer-section"> <div class="customer-content"> <p class="customer-text">Don't have an account?</p> <button (click)="goToSignup()" class="customer-link"> <span>📝</span> <span>Create Account</span> </button> </div> </div> </div> </div> </div>

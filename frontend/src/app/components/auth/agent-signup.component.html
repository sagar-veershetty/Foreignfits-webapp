<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-50 via-white to-purple-50 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8">
    <!-- Logo and Header -->
    <div>
      <div class="flex justify-center">
        <div class="bg-indigo-600 text-white rounded-full w-16 h-16 flex items-center justify-center text-2xl font-bold">
          FF
        </div>
      </div>
      <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
        Shipping Agent Registration
      </h2>
      <p class="mt-2 text-center text-sm text-gray-600">
        Create your account to manage shipments
      </p>
    </div>

    <!-- Success Message -->
    @if (success()) {
      <div class="bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-lg flex items-center gap-2">
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
        <div>
          <p class="font-medium">Registration successful!</p>
          <p class="text-sm">Redirecting to login...</p>
        </div>
      </div>
    }

    <!-- Signup Form -->
    @if (!success()) {
      <form class="mt-8 space-y-6" (ngSubmit)="onSubmit()">
        <!-- Agent Type Selection -->
        <div class="bg-white rounded-lg shadow-sm p-4 space-y-3">
          <label class="block text-sm font-medium text-gray-700">
            Select Agent Type
          </label>
          <div class="grid grid-cols-2 gap-3">
            <!-- China Agent -->
            <button
              type="button"
              (click)="setAgentType('china')"
              [class]="agentType() === 'china' 
                ? 'bg-indigo-600 text-white border-indigo-600' 
                : 'bg-white text-gray-700 border-gray-300 hover:bg-gray-50'"
              class="flex flex-col items-center justify-center p-4 border-2 rounded-lg transition-colors">
              <svg class="h-8 w-8 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
              <span class="text-sm font-medium">China Agent</span>
              <span class="text-xs mt-1">Create orders & manage payments</span>
            </button>

            <!-- India Agent -->
            <button
              type="button"
              (click)="setAgentType('india')"
              [class]="agentType() === 'india' 
                ? 'bg-indigo-600 text-white border-indigo-600' 
                : 'bg-white text-gray-700 border-gray-300 hover:bg-gray-50'"
              class="flex flex-col items-center justify-center p-4 border-2 rounded-lg transition-colors">
              <svg class="h-8 w-8 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
              </svg>
              <span class="text-sm font-medium">India Agent</span>
              <span class="text-xs mt-1">Receive & deliver shipments</span>
            </button>
          </div>
        </div>

        <!-- Form Fields -->
        <div class="bg-white rounded-lg shadow-sm p-6 space-y-4">
          <!-- Name -->
          <div>
            <label for="name" class="block text-sm font-medium text-gray-700 mb-1">
              Full Name *
            </label>
            <input
              id="name"
              type="text"
              [(ngModel)]="name"
              [ngModelOptions]="{standalone: true}"
              required
              class="appearance-none rounded-lg relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
              placeholder="Enter your full name" />
          </div>

          <!-- Email -->
          <div>
            <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
              Email Address *
            </label>
            <input
              id="email"
              type="email"
              [(ngModel)]="email"
              [ngModelOptions]="{standalone: true}"
              required
              class="appearance-none rounded-lg relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
              placeholder="agent@example.com" />
          </div>

          <!-- Password -->
          <div>
            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
              Password *
            </label>
            <input
              id="password"
              type="password"
              [(ngModel)]="password"
              [ngModelOptions]="{standalone: true}"
              required
              class="appearance-none rounded-lg relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
              placeholder="Minimum 6 characters" />
          </div>

          <!-- Confirm Password -->
          <div>
            <label for="confirm-password" class="block text-sm font-medium text-gray-700 mb-1">
              Confirm Password *
            </label>
            <input
              id="confirm-password"
              type="password"
              [(ngModel)]="confirmPassword"
              [ngModelOptions]="{standalone: true}"
              required
              class="appearance-none rounded-lg relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
              placeholder="Re-enter your password" />
          </div>
        </div>

        <!-- Error Message -->
        @if (error()) {
          <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg">
            <p class="text-sm">{{ error() }}</p>
          </div>
        }

        <!-- Submit Button -->
        <div>
          <button
            type="submit"
            [disabled]="loading()"
            class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
            @if (loading()) {
              <svg class="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              <span class="ml-2">Creating Account...</span>
            } @else {
              <span>Create Account</span>
            }
          </button>
        </div>

        <!-- Login Link -->
        <div class="text-center">
          <p class="text-sm text-gray-600">
            Already have an account?
            <a [routerLink]="['/login']" class="font-medium text-indigo-600 hover:text-indigo-500 transition-colors">
              Sign in here
            </a>
          </p>
        </div>
      </form>
    }
  </div>
</div>

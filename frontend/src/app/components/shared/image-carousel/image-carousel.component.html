<div class="relative w-full {{ heightClass }} bg-gray-100 flex items-center justify-center overflow-hidden group">
  <!-- Image -->
  <img
    *ngIf="hasImages"
    [src]="currentImage()"
    [alt]="alt"
    class="w-full h-full object-cover"
    [class.cursor-zoom-in]="zoomable"
    (click)="onImageClick()"
    (error)="onImageError($event)"
  />

  <!-- No image placeholder -->
  <div *ngIf="!hasImages" class="flex flex-col items-center justify-center text-gray-400">
    <svg class="w-16 h-16 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
    </svg>
    <span class="text-sm">No Image</span>
  </div>

  <!-- Prev/Next arrows (only if multiple images) -->
  <ng-container *ngIf="hasMultiple">
    <button
      type="button"
      (click)="prev($event)"
      class="absolute left-1 top-1/2 -translate-y-1/2 bg-black/40 hover:bg-black/60 text-white rounded-full w-7 h-7 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity"
      aria-label="Previous image"
    >
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
      </svg>
    </button>
    <button
      type="button"
      (click)="next($event)"
      class="absolute right-1 top-1/2 -translate-y-1/2 bg-black/40 hover:bg-black/60 text-white rounded-full w-7 h-7 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity"
      aria-label="Next image"
    >
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
      </svg>
    </button>

    <!-- Dot indicators -->
    <div class="absolute bottom-1.5 left-0 right-0 flex items-center justify-center gap-1">
      <button
        type="button"
        *ngFor="let img of images; let i = index"
        (click)="goTo(i, $event)"
        class="w-1.5 h-1.5 rounded-full transition-all"
        [class.bg-white]="i === activeIndex()"
        [class.w-3]="i === activeIndex()"
        [class.bg-white_60]="i !== activeIndex()"
        [ngClass]="i === activeIndex() ? 'bg-white' : 'bg-white/60'"
        [attr.aria-label]="'Go to image ' + (i + 1)"
      ></button>
    </div>

    <!-- Image count badge -->
    <span class="absolute top-1.5 right-1.5 bg-black/50 text-white text-[10px] px-1.5 py-0.5 rounded-full">
      {{ activeIndex() + 1 }}/{{ images.length }}
    </span>
  </ng-container>
</div>

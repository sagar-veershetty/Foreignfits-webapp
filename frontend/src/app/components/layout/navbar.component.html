<nav class="bg-white border-b border-gray-200 shadow-sm sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4">
    <div class="h-14 flex items-center justify-between">
      <!-- Brand -->
      <div class="flex items-center gap-3">
        <img src="/logo.jpeg" alt="Foreign Fits" class="h-8 w-8 rounded" />
        <div class="leading-none">
          <div class="text-base font-semibold text-gray-900">Foreign Fits</div>
          <div class="text-[11px] text-gray-500">Global Fashion</div>
        </div>
      </div>

      <!-- Tabs -->
      <div class="hidden lg:flex items-center gap-1">
        <button *ngFor="let tab of getFilteredTabs()" (click)="navigateTo(tab.route)"
                class="flex items-center gap-2 px-3 py-2 rounded-md text-sm transition-colors"
                [ngClass]="{ 'text-blue-600 bg-blue-50': (router.url === tab.route), 'text-gray-600 hover:bg-gray-100 hover:text-gray-900': (router.url !== tab.route) }">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path [attr.d]="tab.iconPath" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />
          </svg>
          <span class="font-medium">{{ tab.label }}</span>
        </button>
      </div>

      <!-- User -->
      <div class="relative group" *ngIf="authState$ | async as authState">
        <button class="flex items-center gap-2 px-3 py-2 rounded-md bg-gray-100 hover:bg-gray-200">
          <span class="inline-flex h-6 w-6 items-center justify-center rounded-full bg-blue-600 text-white text-xs font-semibold">
            {{ (authState.user?.name || 'U').slice(0,1).toUpperCase() }}
          </span>
          <div class="hidden md:block text-left leading-none">
            <div class="text-sm font-medium text-gray-900">{{ authState.user?.name }}</div>
            <div class="text-[11px] text-gray-500 capitalize">{{ authState.user?.role }}</div>
          </div>
          <svg class="h-4 w-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
        </button>
        <div class="absolute right-0 mt-2 w-56 bg-white rounded-md shadow-lg border border-gray-200 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all">
          <div class="px-3 py-2 border-b border-gray-100 text-xs text-gray-500 uppercase">Account</div>
          <div class="px-3 py-2 border-b border-gray-100">
            <div class="text-sm font-medium text-gray-900">{{ authState.user?.name }}</div>
            <div class="text-xs text-gray-500">{{ authState.user?.email }}</div>
            <div class="text-xs text-blue-600 capitalize mt-1">{{ authState.user?.role }} Access</div>
            <div *ngIf="authState.user?.locationName" class="text-xs text-green-600 mt-1 flex items-center gap-1">
              <svg class="h-3 w-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
              <span>{{ authState.user?.locationName }}</span>
            </div>
          </div>
          <button (click)="logout()" class="w-full text-left px-3 py-2 text-sm text-red-600 hover:bg-red-50 flex items-center gap-2">
            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
            <span>Sign Out</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</nav>
